<div class="video-chat-container">
  <div class="video-grid" #videoGrid>
    <div class="participants">
      <div class="video-wrapper" *ngFor="let p of participants">
        <video autoplay playsinline></video>
        <div class="status-ring" [class.speaking]="p.speaking"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button (click)="toggleMute()">{{ muted ? 'Unmute' : 'Mute' }}</button>
  </div>
</div>
